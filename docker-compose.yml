services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=taskero_backend.settings
    volumes:
      # Persist SQLite database
      - ./backend/data:/app/data
      - ./backend/db.sqlite3:/app/db.sqlite3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
