repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(node_modules/|backend/.*\.pyc|\.env)
      - id: end-of-file-fixer
        exclude: ^(node_modules/|backend/.*\.pyc|\.env)
      - id: check-yaml
        exclude: ^node_modules/
      - id: check-json
        exclude: ^(node_modules/|\.vscode/)
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
        exclude: ^backend/\.env$
      - id: mixed-line-ending
        exclude: ^node_modules/

  # Frontend - ESLint (skip for now due to Next.js config issues)
  # - repo: https://github.com/pre-commit/mirrors-eslint
  #   rev: v9.0.0
  #   hooks:
  #     - id: eslint
  #       files: ^client/.*\.(js|jsx|ts|tsx)$
  #       types: [file]
  #       exclude: ^client/node_modules/
  #       additional_dependencies:
  #         - eslint@^8.57.0
  #         - '@typescript-eslint/eslint-plugin@5.62.0'
  #         - '@typescript-eslint/parser@5.62.0'
  #         - eslint-config-next@14.2.5
  #       args:
  #         - --config
  #         - client/.eslintrc.json
  #         - --resolve-plugins-relative-to
  #         - client

  # Backend - Black (code formatter)
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        files: ^backend/.*\.py$

  # Backend - isort (import sorter)
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^backend/.*\.py$

  # Backend - Flake8 (linter)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: ['--max-line-length=127', '--extend-ignore=E203,W503,E501']
        files: ^backend/.*\.py$
        exclude: ^backend/(migrations|venv|env|__pycache__)/

  # Backend - Django checks (disabled to avoid file modification conflicts)
  # - repo: local
  #   hooks:
  #     - id: django-check
  #       name: Django Check
  #       entry: powershell -c "cd backend; try { python manage.py check } catch { Write-Host 'Django check skipped' }"
  #       language: system
  #       files: ^backend/.*\.py$
  #       pass_filenames: false
  #       always_run: false
  #       stages: [pre-commit]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.1
    hooks:
      - id: bandit
        args: ['-r', 'backend/', '-f', 'json', '-o', 'bandit-report.json', '--skip', 'B101,B104,B105,B106']
        files: ^backend/.*\.py$
        exclude: ^backend/(migrations|venv|env|__pycache__)/
        pass_filenames: false
